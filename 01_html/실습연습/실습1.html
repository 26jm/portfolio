<!DOCTYPE html>
<!-- 문서가 HTML5 문법을 따른다는 것을 선언합니다. -->
<html lang="ko">
	<!-- 문서의 주 언어를 한국어로 지정합니다. -->
	<head>
		<!-- 문서의 메타 정보와 제목을 담는 영역입니다. -->
		<meta charset="UTF-8">
		<!-- 한글이 깨지지 않도록 문자 인코딩을 지정합니다. -->
		<title>계좌 카드</title>
		<!-- 브라우저 탭에 표시할 문서 제목을 지정합니다. -->
	</head>
	<body>
		<!-- 페이지에서 가장 중요한 콘텐츠를 담는 영역입니다. -->
		<main>
			<!-- 하나의 독립적인 계좌 카드 콘텐츠를 나타냅니다. -->
			<article>
				<!-- 계좌 카드의 제목과 은행명을 묶는 머리말 영역입니다. -->
				<header>
					<!-- 계좌 카드의 대표 제목이므로 최상위 제목을 사용합니다. -->
					<h1>국민은행</h1>
				</header>

				<!-- 계좌 항목의 이름과 값을 의미 있게 연결합니다. -->
				<dl>
					<!-- 계좌번호 값의 이름을 표시합니다. -->
					<dt>계좌번호</dt>
					<!-- 개인정보 보호를 위해 계좌번호 일부를 마스킹하여 표시합니다. -->
					<dd>123-45-******</dd>

					<!-- 잔액 값의 이름을 표시합니다. -->
					<dt>잔액</dt>
					<!-- 계좌의 현재 잔액을 표시합니다. -->
					<dd>1,000,000원</dd>
				</dl>

				<!-- 계좌에서 수행할 수 있는 주요 동작을 묶는 영역입니다. -->
				<nav aria-label="계좌 메뉴">
					<!-- 이체 동작을 실행하는 버튼이므로 button 태그를 사용합니다. -->
					<button type="button">이체</button>
					<!-- 계좌 상세 정보 확인 동작을 실행하는 버튼입니다. -->
					<button type="button">상세</button>
				</nav>
			</article>
		</main>
	</body>
</html>


<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- shift + alt  + 화살표-->
    <input type="text" size="5" name="text">
    <input type="password" name="password" required>
    <input type="date" name="date">
    <input type="color">

    <!-- 여러개 중 하나만 선택시킬 때 -->
     <!-- name으로 묶어서 단위를 만들고, value -->
    <!-- value 에는 실제로 백엔드/js에서 사용할 값을 씁니다. 영어로,띄어쓰기없이 작성-->
    <input type="radio" name="gender" value="male">남자
    <input type="radio" name="gender" value="female">여자
    <input type="radio" name="gender" value="none">알리고싶지 않음
    <br />

    <input type="checkbox" name="food" value="pizza">피자<br>
    <input type="checkbox" name="food" value="hamburger">햄버거<br>
    <input type="checkbox" name="food" value="pasta">파스타<br>

    <input type="date" name="date" min="2020-01-01" max="2020-12-31">

    <input type="month" id="month" name="month">

    <input type="week" id="week" name="week">

    <input type="time" id="time" name="time">

    <input type="number" name="num" min="0" max="1000">

    <input type="range" name="point" min="0" max="100">

    <input type="tel" id="phone" name="phone" pattern="[0-9]{3}-[0-9]{4}-[0-9]{4}">

<hr>
<!-- form 의 submit은 폼을 통째로 전달하는 역할 -->
<!-- form 의 reset은 폼을 통째로 초기화하는 역할 -->
<!-- 쿼리스트링: ? 뒤에 키=값 & 키=값 
                ?name=김연지&affiliation=FIS-WONIT-->
<form>
  <label for="name">이름:</label><br>
  <input type="text" id="name" name="name" value="김연지"><br>
  <label for="affiliation">소속:</label><br>
  <input type="text" id="affiliation" name="affiliation" value="SIAT"><br><br>
  <input type="submit" value="전송"> <!-- value를 지워보고 바꿔보기 -->
  <input type="reset" value="초기화">
</form>
</body>
</html>
