<!DOCTYPE html>
<!-- HTML5 문서임을 선언합니다. -->
<html lang="ko">
  <!-- 문서의 기본 언어를 한국어로 지정합니다. -->
  <head>
    <!-- 문서의 메타 정보를 담는 영역입니다. -->
    <meta charset="UTF-8">
    <!-- 한글이 깨지지 않도록 문자 인코딩을 지정합니다. -->
    <title>계좌 카드</title>
    <!-- 브라우저 탭에 표시할 문서 제목을 지정합니다. -->
  </head>
  <body>
    <!-- 페이지의 핵심 콘텐츠를 담는 영역입니다. -->
    <main>
      <!-- 하나의 독립적인 계좌 카드 콘텐츠를 나타냅니다. -->
      <article>
        <!-- 계좌 카드의 제목 영역을 나타냅니다. -->
        <header>
          <!-- 계좌 카드의 대표 제목이므로 h1을 사용합니다. -->
          <h1>OO은행</h1>
        </header>

        <!-- 계좌번호와 잔액 정보를 묶는 영역입니다. -->
        <section>
          <!-- 정보의 이름과 값을 연결하기 위해 정의 목록을 사용합니다. -->
          <dl>
            <!-- 계좌번호 값의 이름을 표시합니다. -->
            <dt>계좌번호</dt>
            <!-- 개인정보 보호를 위해 계좌번호 일부를 마스킹해 표시합니다. -->
            <dd>123-4567-****-89</dd>

            <!-- 잔액 값의 이름을 표시합니다. -->
            <dt>잔액</dt>
            <!-- 계좌의 현재 잔액을 강조해 표시합니다. -->
            <dd><strong>1,500,000원</strong></dd>
          </dl>
        </section>

        <!-- 계좌 카드의 하단 동작 영역을 나타냅니다. -->
        <footer>
          <!-- 이체 동작을 실행하는 버튼이므로 button을 사용합니다. -->
          <button type="button">이체</button>
          <!-- 상세 정보 확인 동작을 실행하는 버튼입니다. -->
          <button type="button">상세</button>
        </footer>
      </article>
    </main>
  </body>
</html>
